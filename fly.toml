app = "assassins-in-plain-site"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  BELLWARD_SECURE_COOKIES = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[mounts]]
  source = "bellward_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
